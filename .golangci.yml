version: "2"

# RawClaw lint config. Keep the linter set lean and CLI-focused: catch real
# correctness bugs, not stylistic noise. errcheck stays ON, but the two
# universally-ignored families are excluded — writes to an io.Writer (print-style
# output to stdout/buffers) and defer Close() on read paths —
# because their errors are non-actionable and checking them adds noise without
# changing behavior.
linters:
  default: standard
  enable:
    - dupl
    - gocritic
    - modernize
  settings:
    dupl:
      threshold: 75
    errcheck:
      exclude-functions:
        # print-style writes to os.Stdout / buffers:
        - (io.Writer).Write
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # defer Close() on read-only handles / connections:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*os.File).Close
        - (io.Closer).Close
  exclusions:
    rules:
      # Test code may ignore Scan/Close errors in assertions for brevity.
      - path: _test\.go
        linters:
          - errcheck

issues:
  # The dupl/gocritic/modernize findings inventoried in
  # docs/notes/lint-baseline-20260826.md are a paydown work-list, not a CI
  # gate: only code changed after the linters were enabled (43cb92f) is
  # linted. Remove this ratchet once the baseline is cleared.
  new-from-rev: 43cb92f
